<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Word&character Count</h2>
    <textarea id="maintText" placeholder="type here....."></textarea>
    <div>
    CharCount: <span id="charCount">0</span><br>
    WordsCount: <span id="wordsCount">0</span>
    </div>
    <script>
        document.getElementById("maintText").addEventListener("input", function() {
            let text = this.value;
            document.getElementById("charCount").innerText = text.length;
            let trimmed = text.trim();
            let words = text == "" ? 0 : text.split(/\s+/).length;
            document.getElementById("wordsCount").innerText = words;
        });
    </script>
</body>
</html>
